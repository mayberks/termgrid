<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" rx="40" ry="36" fill="#1e1e1e"/>

  <!-- 2x2 grid: alternating teal/blue rounded squares -->
  <rect x="30"  y="30"  width="98" height="98" rx="14" ry="14"
        fill="none" stroke="#4ec9b0" stroke-width="10"/>
  <rect x="128" y="30"  width="98" height="98" rx="14" ry="14"
        fill="none" stroke="#007acc" stroke-width="10"/>
  <rect x="30"  y="128" width="98" height="98" rx="14" ry="14"
        fill="none" stroke="#007acc" stroke-width="10"/>
  <rect x="128" y="128" width="98" height="98" rx="14" ry="14"
        fill="none" stroke="#4ec9b0" stroke-width="10"/>
</svg>